services:
  proxy:
    image: nginx:1.31.3-alpine
    container_name: global_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
      - ./certs/:/etc/nginx/certs/:ro
      - certbot_webroot:/var/www/certbot
    networks: [proxy_net]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Сертификаты кладутся в ./certs/ вручную, поэтому сервис не нужен и
  # намеренно не поднимается: стек запускается как `docker compose up -d proxy`.
  # Оставлен на случай перехода на автовыпуск — тогда `up -d certbot`.
  certbot:
    image: certbot/certbot:latest
    container_name: global_certbot
    restart: unless-stopped
    volumes:
      - ./certs/:/etc/letsencrypt/
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

networks:
  proxy_net:
    external: true

volumes:
  certbot_webroot:
