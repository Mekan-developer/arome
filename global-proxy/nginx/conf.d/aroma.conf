# Пока сертификатов нет, прокси работает по чистому HTTP. Когда
# certs/live/arome-tm.com/ будет заполнен настоящими файлами, этот
# конфиг заменяется на aroma-ssl.conf.disabled (см. README-шаги ниже
# в комментарии к тому файлу).
server {
    listen 80 default_server;
    server_name arome-tm.com _;

    client_max_body_size 60M;   # импорт Excel и фото товаров

    # Оставлено заранее: по этому пути certbot будет забирать сертификат,
    # редиректа на https здесь нет — иначе проверка не пройдёт.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Адрес апстрима вынесен в переменную намеренно: с литеральным
    # proxy_pass nginx резолвит имя один раз при старте и падает с
    # [emerg] host not found in upstream, если контейнер приложения в
    # этот момент ещё не поднят — прокси уходит в restart-loop и сайт
    # лежит до ручного запуска в правильном порядке. С переменной имя
    # резолвится на каждый запрос через встроенный DNS докера, поэтому
    # прокси стартует независимо от приложения и подхватывает его сам.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://aroma_nginx:80;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 120s;    # импорт больших Excel
    }
}
