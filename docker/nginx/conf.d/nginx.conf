# Запрос приходит от хостового nginx, то есть с адреса docker-шлюза, а настоящий
# IP клиента — в X-Forwarded-For. real_ip возвращает его в $remote_addr, доверяя
# заголовку только с приватных адресов.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Порт, по которому сайт открыт снаружи. Внутри контейнера nginx всегда слушает 80,
# а наружу порт публикует docker — в dev это 8090. $server_port знает только про
# внутренние 80, поэтому берём порт из Host, как его набрал клиент, и лишь при Host
# без порта возвращаемся к внутреннему. Иначе Laravel, доверяющий X-Forwarded-Port,
# считал портом 80, опускал его как порт по умолчанию, и редирект с :8090 уезжал на
# http://127.0.0.1/login.
map $http_host $forwarded_port {
    "~:(?<hostport>\d+)$"  $hostport;
    default                $server_port;
}

server {
    listen 80;
    # Домен разбирает хостовый nginx, сюда доходит уже отобранный им трафик.
    server_name _;
    server_tokens off;

    root /var/www/laravel/public;
    index index.php;

    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Vite именует файлы по хэшу содержимого, поэтому их можно кэшировать навсегда:
    # при новой сборке меняется имя, а не содержимое по старому адресу.
    location /build/ {
        access_log off;
        add_header Cache-Control "public,  max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # В public лежит ровно один php-файл — точка входа. Всё остальное, что
    # пришло с .php на конце, исполнять нечего и незачем.
    location ~ ^/index\.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Laravel доверяет X-Forwarded-* от кого угодно (trustProxies at: '*'),
        # поэтому значения ставятся здесь, а не берутся из заголовков: подменённый
        # хост уводит ссылки (в том числе в письме сброса пароля) на чужой домен.
        # Всё нужное уже есть: Host хостовый nginx передаёт как есть, схема везде
        # http, $remote_addr развёрнут real_ip выше, порт разобран map-ом наверху.
        # С появлением TLS — заменить $scheme на $http_x_forwarded_proto, а в map
        # добавить 443 по умолчанию для https.
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $forwarded_port;

        fastcgi_read_timeout 180s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico {
      access_log off; log_not_found off;
    }

    location = /robots.txt  {
         access_log off; log_not_found off;
    }

}


