server {
    listen 80;
    # Прод отвечает на arome-tm.com, `_` оставлен намеренно: тот же конфиг
    # монтируется в dev на localhost:8090 и открывается по IP сервера.
    server_name arome-tm.com www.arome-tm.com _;
    server_tokens off;

    root /var/www/laravel/public;
    index index.php;

    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Vite именует файлы по хэшу содержимого, поэтому их можно кэшировать навсегда:
    # при новой сборке меняется имя, а не содержимое по старому адресу.
    location /build/ {
        access_log off;
        add_header Cache-Control "public,  max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # В public лежит ровно один php-файл — точка входа. Всё остальное, что
    # пришло с .php на конце, исполнять нечего и незачем.
    location ~ ^/index\.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # nginx здесь — крайний узел, прокси перед ним нет, а Laravel доверяет
        # X-Forwarded-* от кого угодно (trustProxies at: '*'). Клиентские значения
        # перебиваются реальными: иначе чужой заголовок подменяет хост в ссылках
        # (в том числе в письме сброса пароля) и переводит их на несуществующий https.
        # Когда перед nginx появится TLS-терминатор — заменить на $http_x_forwarded_*.
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;

        fastcgi_read_timeout 180s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico {
      access_log off; log_not_found off;
    }

    location = /robots.txt  {
         access_log off; log_not_found off;
    }

}


