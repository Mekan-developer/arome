# Запрос приходит от хостового nginx, то есть с адреса docker-шлюза, а настоящий
# IP клиента — в X-Forwarded-For. real_ip возвращает его в $remote_addr, доверяя
# заголовку только с приватных адресов.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Схема и порт, какими сайт открыт снаружи. Хостовый nginx (он же снимает TLS)
# присылает их в X-Forwarded-Proto/Port — тогда верим ему. Локально, на
# 127.0.0.1:8000, перед контейнером никого нет и заголовков нет: пустое значение
# Laravel принимал за порт, опускал его, и редирект уезжал на http://127.0.0.1/login.
# Поэтому без заголовка схема — своя, а порт — из Host, как его набрал клиент.
map $http_x_forwarded_proto $forwarded_proto {
    ""       $scheme;
    default  $http_x_forwarded_proto;
}

map $http_host $host_port {
    "~:(?<hostport>\d+)$"  $hostport;
    default                "";
}

# Порядок: заголовок хостового nginx → порт из Host → 443 для https → внутренний.
map "$http_x_forwarded_port:$host_port:$forwarded_proto" $forwarded_port {
    "~^(?<fwdport>\d+):"   $fwdport;
    "~^:(?<hport>\d+):"    $hport;
    "~^::https$"           443;
    default                $server_port;
}

server {
    listen 80;
    # Домен разбирает хостовый nginx, сюда доходит уже отобранный им трафик.
    server_name _;
    server_tokens off;

    root /var/www/laravel/public;
    index index.php;

    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Vite именует файлы по хэшу содержимого, поэтому их можно кэшировать навсегда:
    # при новой сборке меняется имя, а не содержимое по старому адресу.
    location /build/ {
        access_log off;
        add_header Cache-Control "public,  max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # В public лежит ровно один php-файл — точка входа. Всё остальное, что
    # пришло с .php на конце, исполнять нечего и незачем.
    location ~ ^/index\.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Laravel доверяет X-Forwarded-* от кого угодно (trustProxies at: '*'),
        # поэтому значения ставятся здесь, а не пробрасываются как пришли: хост —
        # только из Host, иначе подменённый заголовок уводит ссылки (в том числе в
        # письме сброса пароля) на чужой домен. Схема и порт разобраны map-ами
        # наверху, $remote_addr развёрнут real_ip.
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $forwarded_port;

        fastcgi_read_timeout 180s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico {
      access_log off; log_not_found off;
    }

    location = /robots.txt  {
         access_log off; log_not_found off;
    }

}
