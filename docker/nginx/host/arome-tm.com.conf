# Конфиг для nginx, установленного на самом сервере (не в контейнере). Он держит
# 80-й порт и проксирует в контейнер на 127.0.0.1:8080.
#
# Установка:
#   sudo cp /srv/projects/arome/docker/nginx/host/arome-tm.com.conf \
#           /etc/nginx/sites-available/arome-tm.com
#   sudo ln -s /etc/nginx/sites-available/arome-tm.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name arome-tm.com www.arome-tm.com;

    server_tokens off;

    # Держать вровень с client_max_body_size контейнерного nginx и с
    # upload_max_filesize в docker/php/php.ini: режет по меньшему из трёх, и
    # обрыв на хосте выглядит как 413 без единой строки в логах Laravel.
    client_max_body_size 50M;

    access_log /var/log/nginx/arome-tm.com.access.log;
    error_log  /var/log/nginx/arome-tm.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Host идёт как есть: из него Laravel строит абсолютные ссылки, и
        # подстановка 127.0.0.1 увела бы ссылки в письмах на localhost.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Импорт прайса разбирает файл синхронно; 60 секунд по умолчанию режут
        # его 504-й на середине. Совпадает с fastcgi_read_timeout контейнера.
        proxy_read_timeout 180s;
    }
}
