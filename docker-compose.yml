x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
    args:
      UID: ${UID:-1000}
  image: aroma-app:latest
  pull_policy: build
  restart: unless-stopped
  working_dir: /var/www/html
  env_file: .env
  volumes:
    - storage_app:/var/www/html/storage/app
    - backups:/var/www/html/storage/app/backups
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [aroma_network]
  logging: *logging

services:
  app:
    <<: *app-base
    container_name: aroma_app
    environment:
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app-base
    container_name: aroma_scheduler
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: aroma-web:latest
    pull_policy: build
    container_name: aroma_nginx
    restart: unless-stopped
    volumes:
      - storage_app:/var/www/html/storage/app:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aroma_network
      - proxy_net
    logging: *logging

  db:
    image: postgres:16.14-alpine
    container_name: aroma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aroma_network]
    logging: *logging

  redis:
    image: redis:8.10-alpine
    container_name: aroma_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [aroma_network]
    logging: *logging

networks:
  aroma_network:
    driver: bridge
  proxy_net:
    external: true

volumes:
  db_data:
  redis_data:
  storage_app:
  backups:
