services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
      args:
        UID: ${UID:-1000}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirror.yandex.ru/mirrors/alpine}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: aroma-app:latest
    pull_policy: build
    container_name: aroma_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - storage_app:/var/www/html/storage/app
      - backups:/var/www/html/storage/app/backups
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aroma_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
      args:
        UID: ${UID:-1000}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirror.yandex.ru/mirrors/alpine}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: aroma-app:latest
    pull_policy: build
    container_name: aroma_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    command: php artisan schedule:work
    volumes:
      - storage_app:/var/www/html/storage/app
      - backups:/var/www/html/storage/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - aroma_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
      args:
        UID: ${UID:-1000}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirror.yandex.ru/mirrors/alpine}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: aroma-web:latest
    pull_policy: build
    container_name: aroma_nginx
    restart: unless-stopped
    # Порт открыт ТОЛЬКО на loopback — снаружи он недоступен,
    # к нему ходит хостовый nginx через proxy_pass.
    ports:
      # - "127.0.0.1:8080:80"
      - "${APP_PORT_BIND:-127.0.0.1:8080}:80"
    volumes:
      - storage_app:/var/www/html/storage/app:ro
    healthcheck:
      # Именно 127.0.0.1, а не localhost: busybox-wget идёт сначала по ::1,
      # а nginx слушает только IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aroma_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16.14-alpine
    container_name: aroma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aroma_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.10-alpine
    container_name: aroma_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aroma_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aroma_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  storage_app:
  backups:
