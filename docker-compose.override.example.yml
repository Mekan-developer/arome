services:
  app:
    environment:
      RUN_MIGRATIONS: "true"
      OPTIMIZE_ON_BOOT: "false"
    volumes:
      - ./:/var/www/html
      - ./docker/php/opcache-dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro

  scheduler:
    environment:
      OPTIMIZE_ON_BOOT: "false"
    volumes:
      - ./:/var/www/html
      - ./docker/php/opcache-dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro

  nginx:
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/

  db:
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
